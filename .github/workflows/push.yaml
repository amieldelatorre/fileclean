name: Build and Test on Push

on:
  push:
    branches:
      - '**'
      - '!releases/**'
      - '!release/**'
    paths-ignore:
      - '.github/**'
    tags-ignore:
      - '**'
  #pull_request:
  workflow_call:

jobs:
  build_and_test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        go-version: ['1.26.x']
  
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Setup Go
        uses: actions/setup-go@v6
        with:
          go-version: '1.26.x'

      - name: Download Dependencies
        run: |
          go mod download

      - name: Build Binary
        run: |
          go build -o fileclean .
          
      - name: Run Tests
        run: |
          go test ./... -v
